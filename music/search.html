<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
</head>
<body>
  <h2>Audius Music Player</h2>

  <input type="text" id="search" placeholder="Search songs">
  <button onclick="searchSongs()">Search</button>

  <div id="results"></div>

  <audio id="player" controls></audio>

  <script>
    async function searchSongs() {
      const query = document.getElementById("search").value;
      const results = document.getElementById("results");

      results.innerHTML = "Loading...";

      try {
        const response = await fetch(
          `https://api.audius.co/v1/tracks/search?query=${encodeURIComponent(query)}`
        );

        const data = await response.json();
        results.innerHTML = "";

        data.data.forEach(song => {
          const div = document.createElement("div");
          const button = document.createElement("button");

          div.textContent = song.title + " - " + song.user.name + " ";

          button.textContent = "Play";
          button.onclick = () => {
            const player = document.getElementById("player");
            player.src =
              `https://api.audius.co/v1/tracks/${song.id}/stream`;
            player.play();
          };

          div.appendChild(button);
          results.appendChild(div);
        });
      } catch (error) {
        results.textContent = "Unable to load songs.";
        console.error(error);
      }
    }
  </script>
</body>
</html>
